[package]
name = "winquery"
version = "1.0.0"
edition = "2021"

[dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Performance",
  "Win32_System_SystemInformation",
  "Win32_Storage_FileSystem",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Graphics_Dxgi",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
